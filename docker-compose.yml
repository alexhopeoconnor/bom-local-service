services:
  bom-local-service:
    image: ${BOM_IMAGE:-ghcr.io/alexhopeoconnor/bom-local-service:v0.1.1}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8082}:${CONTAINER_PORT:-8080}"
    volumes:
      - "${BOM_CACHE_PATH:-./cache}:/app/cache"
    environment:
      # ASP.NET Core configuration
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:${CONTAINER_PORT:-8080}

      # Virtual display for the non-headless browser
      - DISPLAY=:99

      # CORS Configuration (for Home Assistant integration)
      - CORS__ALLOWEDORIGINS=${CORS__ALLOWEDORIGINS:-*}
      - CORS__ALLOWEDMETHODS=${CORS__ALLOWEDMETHODS:-GET,POST,DELETE,OPTIONS}
      - CORS__ALLOWEDHEADERS=${CORS__ALLOWEDHEADERS:-*}
      - CORS__ALLOWCREDENTIALS=${CORS__ALLOWCREDENTIALS:-false}

      # Application configuration (double underscore for nested keys)
      - CACHEDIRECTORY=${CACHEDIRECTORY:-/app/cache}
      - CACHERETENTIONHOURS=${CACHERETENTIONHOURS:-24}
      - CACHEEXPIRATIONMINUTES=${CACHEEXPIRATIONMINUTES:-12.5}
      - CACHEMANAGEMENT__CHECKINTERVALMINUTES=${CACHEMANAGEMENT__CHECKINTERVALMINUTES:-5}
      - CACHEMANAGEMENT__INITIALDELAYSECONDS=${CACHEMANAGEMENT__INITIALDELAYSECONDS:-10}
      - CACHEMANAGEMENT__LOCATIONSTAGGERSECONDS=${CACHEMANAGEMENT__LOCATIONSTAGGERSECONDS:-1}
      - CACHECLEANUP__INTERVALHOURS=${CACHECLEANUP__INTERVALHOURS:-1}
      - REFRESH__QUEUECAPACITY=${REFRESH__QUEUECAPACITY:-16}
      - REFRESH__MAXCONCURRENTCAPTURES=${REFRESH__MAXCONCURRENTCAPTURES:-1}
      - REFRESH__CAPTURETIMEOUTSECONDS=${REFRESH__CAPTURETIMEOUTSECONDS:-300}
      - REFRESH__BACKOFFBASESECONDS=${REFRESH__BACKOFFBASESECONDS:-60}
      - REFRESH__MAXBACKOFFSECONDS=${REFRESH__MAXBACKOFFSECONDS:-900}
      - SCREENSHOT__DYNAMICCONTENTWAITMS=${SCREENSHOT__DYNAMICCONTENTWAITMS:-1500}
      - SCREENSHOT__TILERENDERWAITMS=${SCREENSHOT__TILERENDERWAITMS:-3000}
      - DEBUG__ENABLED=${DEBUG__ENABLED:-false}
      - DEBUG__WAITMS=${DEBUG__WAITMS:-2000}
      - TIMEZONE=${TIMEZONE:-Australia/Brisbane}
    shm_size: ${BOM_SHM_SIZE:-1gb}
    ipc: ${BOM_IPC:-host}
    cpus: ${BOM_CPU_LIMIT:-2.0}
    mem_limit: ${BOM_MEMORY_LIMIT:-2g}
    init: true
    restart: unless-stopped
