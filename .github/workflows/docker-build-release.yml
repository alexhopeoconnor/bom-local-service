name: Promote tested image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must equal v<MSBuild Version>)
        required: true
        type: string
      candidate_run_id:
        description: Run whose candidate-manifest artifact is already qualified (live and runner evidence bound)
        required: true
        type: string
      confirm:
        description: Repeat the tag to authorize publication
        required: true
        type: string
      update_latest:
        description: Move latest to this stable version if it advances; otherwise leave latest unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Publication is serialized repository-wide. Per-tag concurrency is not enough
# because latest is a shared reference and must advance monotonically.
#
# The candidate-manifest artifact must already be qualified: service-checks
# produces an unqualified manifest by design, and later live/runner evidence is
# bound and qualified by the coordinator before this workflow is dispatched.
concurrency:
  group: image-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote exact tested content
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release authorization
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRM_TAG: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          if [[ "$RELEASE_TAG" != "$CONFIRM_TAG" ]]; then
            echo "confirm input must repeat the release tag exactly" >&2
            exit 1
          fi
          version="$(python3 scripts/prepare-candidate.py version --csproj BomLocalService.csproj)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "release tag $RELEASE_TAG must equal v<MSBuild Version> (v$version)" >&2
            exit 1
          fi

      - name: Download candidate manifest
        uses: actions/download-artifact@v4
        with:
          name: candidate-manifest
          path: artifacts/candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read candidate architecture scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          manifest = json.load(open("artifacts/candidate/candidate.json"))
          print(
              "include_arm64="
              + ("true" if "arm64" in manifest.get("images", {}) else "false")
          )
          PY

      - name: Download amd64 tested archive
        uses: actions/download-artifact@v4
        with:
          name: candidate-image-amd64
          path: artifacts/images/amd64
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download arm64 tested archive
        if: ${{ steps.scope.outputs.include_arm64 == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-image-arm64
          path: artifacts/images/arm64
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify qualified candidate against this revision
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ( cd artifacts/candidate && sha256sum -c candidate.json.sha256 )
          archive_args=(--archive-dir "amd64=artifacts/images/amd64")
          if [[ -d artifacts/images/arm64 ]]; then
            archive_args+=(--archive-dir "arm64=artifacts/images/arm64")
          fi
          python3 scripts/prepare-candidate.py verify \
            --candidate artifacts/candidate/candidate.json \
            --candidate-dir artifacts/candidate \
            --source-dir . \
            "${archive_args[@]}" \
            --require-files \
            --require-archives \
            --require-all-arches \
            --require-qualified \
            --require-unpublished
          version="$(python3 scripts/prepare-candidate.py show \
            --candidate artifacts/candidate/candidate.json --field version)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "candidate version $version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          candidate_commit="$(python3 scripts/prepare-candidate.py show \
            --candidate artifacts/candidate/candidate.json --field source.commit)"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$candidate_commit" != "$checkout_commit" ]]; then
            echo "candidate source $candidate_commit does not match release revision $checkout_commit" >&2
            exit 1
          fi

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact image IDs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          args=(
            --candidate artifacts/candidate/candidate.json
            --candidate-dir artifacts/candidate
            --source-dir .
            --archive-dir "amd64=artifacts/images/amd64"
            --tag "$RELEASE_TAG"
            --registry "$REGISTRY"
            --repository "$IMAGE_NAME"
            --authorize "$RELEASE_TAG"
            --execute
            --result artifacts/promotion/promotion-result.json
          )
          if [[ -d artifacts/images/arm64 ]]; then
            args+=(--archive-dir "arm64=artifacts/images/arm64")
          fi
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            args+=(--update-latest)
          fi
          python3 scripts/promote-candidate.py "${args[@]}"

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-evidence
          path: artifacts/promotion
          if-no-files-found: warn
